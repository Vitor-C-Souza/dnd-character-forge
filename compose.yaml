services:
  mysql:
    image: mysql:8.4
    container_name: characterforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-characterforge}
      MYSQL_USER: ${MYSQL_USER:-characterforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-characterforge}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - characterforge

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: characterforge-api
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-characterforge}
      DB_USERNAME: ${MYSQL_USER:-characterforge}
      DB_PASSWORD: ${MYSQL_PASSWORD:-characterforge}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - characterforge

volumes:
  mysql_data:

networks:
  characterforge:
    driver: bridge
